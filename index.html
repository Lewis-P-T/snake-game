<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Snake</title>
<style>
  body { background:#0b2e13; color:#d7ffd9; font-family:'Trebuchet MS',sans-serif; display:flex; flex-direction:column; align-items:center; }
  h1 { color:#4ade80; text-shadow:2px 2px #052e0d; letter-spacing:2px; margin-bottom:4px; }
  #score { font-size:1.2em; margin:4px; }
  #score .you { color:#4ade80; }
  #score .ai { color:#c084fc; }
  #goal { margin:0; font-size:0.85em; opacity:0.7; }
  #wrap { position:relative; margin-top:16px; }
  canvas { background:#123d1a; border:4px solid #2f6b3a; border-radius:8px; touch-action:none; display:block; }
  #overlay {
    position:absolute; inset:0; display:none; flex-direction:column;
    align-items:center; justify-content:center; gap:10px;
    background:rgba(5,20,8,0.85); border-radius:8px; text-align:center;
  }
  #overlay.show { display:flex; }
  #overlay h2 { color:#f87171; margin:0; font-size:2em; }
  button { font-size:1.2em; padding:10px 16px; margin:2px; background:#2f6b3a; color:#d7ffd9; border:none; border-radius:6px; cursor:pointer; }
  button:hover { background:#3f8a4c; }
  #difficulty { margin-top:14px; display:flex; align-items:center; gap:6px; }
  #difficulty button { font-size:1em; padding:6px 12px; }
  #difficulty button.active { background:#4ade80; color:#052e0d; font-weight:bold; }
  #counts { margin-top:10px; display:flex; flex-direction:column; gap:6px; font-size:0.9em; }
  #counts label { display:flex; align-items:center; gap:8px; }
  #counts input[type=range] { accent-color:#4ade80; }
</style>
</head>
<body>
<h1>🐍 Snake</h1>
<p id="score"><span class="you">You: 0</span> &nbsp;·&nbsp; <span class="ai">AI: 0</span></p>
<p id="goal">First to 10 bugs wins — grab the 🍄 for speed + shield</p>
<div id="wrap">
  <canvas id="game" width="400" height="400"></canvas>
  <div id="overlay">
    <h2 id="overlayTitle"></h2>
    <p id="overlayMsg"></p>
    <button id="restartBtn">Play again</button>
  </div>
</div>
<div id="difficulty">
  <button data-diff="easy">Easy</button>
  <button data-diff="normal">Normal</button>
  <button data-diff="hard">Hard</button>
</div>
<div id="counts">
  <label>Bugs: <span id="bugVal">2</span>
    <input id="bugSlider" type="range" min="1" max="5" step="1" value="2">
  </label>
  <label>Rocks: <span id="rockVal">6</span>
    <input id="rockSlider" type="range" min="5" max="10" step="1" value="6">
  </label>
</div>
<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const grid = 20;
const gw = canvas.width / grid, gh = canvas.height / grid;
const RESPAWN_MS = 3000;                      // wait before a size-1 snake respawns
const BOOST_MS = 10000;                       // mushroom: speed + invincibility duration
const MUSHROOM_RESPAWN_MS = 10000;            // new mushroom appears this long after one is eaten
const WIN_SCORE = 10;
let BUG_COUNT = 2;                            // Bugs slider (1–5)
let STONE_COUNT = 6;                          // Rocks slider (5–10)
const BASE_MS = 120;                          // loop granularity
const PLAYER_SPEED = 0.5;                     // cells per tick -> a move every 240ms
const AI_SPEED = 0.5;                         // AI moves at the player's normal speed (constant)
const BUG_SPEED = 0.25;                       // 50% slower than the player
const BOOST_MULT = 1.5;                       // mushroom makes a snake 50% faster
const AI_RANDOM = { easy: 2, normal: 4, hard: 8 };  // every Nth AI move is random (easy = dumbest)

const rand = n => Math.floor(Math.random() * n);
const manhattan = (a, b) => Math.abs(a.x - b.x) + Math.abs(a.y - b.y);
const onSnake = (s, p) => s.body.some(c => c.x === p.x && c.y === p.y);
const wrap = p => ({ x: (p.x + gw) % gw, y: (p.y + gh) % gh });   // edges connect
const DIRS = [{x:1,y:0},{x:-1,y:0},{x:0,y:1},{x:0,y:-1}];

function makeSnake(pos, dir, colors) {
  return { body: [pos], dir, ...colors, score: 0, alive: true,
           respawnAt: 0, acc: 0, moves: 0, boostUntil: 0, randomPeriod: 4 };
}

const player = makeSnake({x:4, y:10}, {x:1,y:0},
  { body_: '#22c55e', head: '#4ade80', eye: '#052e0d' });
const ai = makeSnake({x:15, y:10}, {x:-1,y:0},
  { body_: '#9333ea', head: '#c084fc', eye: '#2e0552' });
let bugs = [];
let stones = [];
let mushroom = null;
let mushroomAt = 0;
let bugAcc = 0;
let matchOver = false;
let started = false;
let frame = 0;

function other(s) { return s === player ? ai : player; }
const onStone = p => stones.some(s => s.x === p.x && s.y === p.y);
const onBug = p => bugs.some(b => b.x === p.x && b.y === p.y);
const onMushroom = p => mushroom && mushroom.x === p.x && mushroom.y === p.y;
const invincible = s => Date.now() < s.boostUntil;   // mushroom shield (also = speed boost window)

// snake start cells + the lane just ahead of each — kept clear so rocks never
// force an instant hit at the start of a match.
function reservedCells() {
  return [
    {x:4,y:10},{x:5,y:10},{x:6,y:10},{x:7,y:10},
    {x:15,y:10},{x:14,y:10},{x:13,y:10},{x:12,y:10},
  ];
}

function randomStone(placed) {
  const reserved = reservedCells();
  let p;
  do { p = {x: rand(gw), y: rand(gh)}; }
  while (reserved.some(c => c.x===p.x && c.y===p.y) || placed.some(c => c.x===p.x && c.y===p.y));
  return p;
}

function randomBug(existing) {
  let p;
  do { p = {x: rand(gw), y: rand(gh)}; }
  while (onSnake(player, p) || onSnake(ai, p) || onStone(p) || onMushroom(p) ||
         existing.some(b => b.x===p.x && b.y===p.y));
  return p;
}

function placeMushroom() {
  let p;
  do { p = {x: rand(gw), y: rand(gh)}; }
  while (onSnake(player, p) || onSnake(ai, p) || onStone(p) || onBug(p));
  mushroom = p;
}

// each bug tries ONE random direction per move; blocked squares (rock, snake,
// another bug) make it stay put. Edges wrap to the opposite side.
function roamBugs() {
  for (let i = 0; i < bugs.length; i++) {
    const d = DIRS[rand(4)];
    const p = wrap({x: bugs[i].x + d.x, y: bugs[i].y + d.y});
    if (onStone(p) || onSnake(player, p) || onSnake(ai, p)) continue;
    if (bugs.some((b, j) => j !== i && b.x===p.x && b.y===p.y)) continue;
    bugs[i] = p;
  }
}

// --- overlay ----------------------------------------------------------------
const overlay = document.getElementById('overlay');
function showOverlay(title, msg, btnLabel) {
  document.getElementById('overlayTitle').textContent = title;
  document.getElementById('overlayMsg').textContent = msg;
  const btn = document.getElementById('restartBtn');
  if (btnLabel) { btn.textContent = btnLabel; btn.style.display = ''; }
  else { btn.style.display = 'none'; }
  overlay.classList.add('show');
}
function hideOverlay() { overlay.classList.remove('show'); }

// --- player input (keyboard only) -------------------------------------------
function setDir(d) {
  if (!player.alive || matchOver) return;
  const c = player.dir;
  if (d === 'up' && c.y === 0) player.dir = {x:0,y:-1};
  else if (d === 'down' && c.y === 0) player.dir = {x:0,y:1};
  else if (d === 'left' && c.x === 0) player.dir = {x:-1,y:0};
  else if (d === 'right' && c.x === 0) player.dir = {x:1,y:0};
}
document.addEventListener('keydown', e => {
  const map = {ArrowUp:'up', ArrowDown:'down', ArrowLeft:'left', ArrowRight:'right'};
  if (map[e.key]) { e.preventDefault(); setDir(map[e.key]); }
});
document.getElementById('restartBtn').addEventListener('click', startGame);

// --- difficulty = how random the AI plays -----------------------------------
function setDifficulty(d) {
  ai.randomPeriod = AI_RANDOM[d];
  document.querySelectorAll('#difficulty button').forEach(b =>
    b.classList.toggle('active', b.dataset.diff === d));
}
document.getElementById('difficulty').addEventListener('click', e => {
  if (e.target.dataset.diff) setDifficulty(e.target.dataset.diff);
});

// --- AI steering ------------------------------------------------------------
// ponytail: naive one-step greedy heuristic toward the nearest target (bug or
// mushroom), dodging rocks and snakes. Every Nth move it goes random instead —
// that dial is the difficulty. Upgrade to BFS only if it ever needs to.
function aiTargets() { return mushroom ? bugs.concat([mushroom]) : bugs; }

function aiGreedyDir() {
  const head = ai.body[0];
  const targets = aiTargets();
  let best = ai.dir, bestScore = -Infinity;
  for (const d of DIRS) {
    if (d.x === -ai.dir.x && d.y === -ai.dir.y) continue; // no 180°
    const cell = wrap({x: head.x + d.x, y: head.y + d.y});
    if (onStone(cell) || onSnake(ai, cell) || (player.alive && onSnake(player, cell))) continue;
    const near = Math.min(...targets.map(t => manhattan(cell, t)));
    const score = -near + Math.random() * 0.5;
    if (score > bestScore) { bestScore = score; best = d; }
  }
  return best;
}

function aiRandomDir() {
  const opts = DIRS.filter(d => !(d.x === -ai.dir.x && d.y === -ai.dir.y));
  return opts[rand(opts.length)];
}

// --- match flow -------------------------------------------------------------
function updateScores() {
  document.querySelector('#score .you').textContent = 'You: ' + player.score;
  document.querySelector('#score .ai').textContent  = 'AI: '  + ai.score;
}

function endMatch(winner) {
  if (matchOver) return;
  matchOver = true;
  const won = winner === player;
  showOverlay(won ? '🏆 You win!' : '💀 AI wins!',
              'You ' + player.score + '  ·  AI ' + ai.score, 'Play again');
}

function showStartScreen() {
  started = false;
  showOverlay('🐍 Snake', 'First to 10 bugs — arrow keys to move', 'Start game');
}

function startGame() {
  newMatch();
  started = true;
}

function resetSnake(s, pos, dir) {
  s.body = [pos]; s.dir = {...dir};
  s.alive = true; s.respawnAt = 0; s.score = 0; s.acc = 0; s.moves = 0; s.boostUntil = 0;
}

function resetBoardItems() {
  stones = [];
  while (stones.length < STONE_COUNT) stones.push(randomStone(stones));
  bugs = [];
  while (bugs.length < BUG_COUNT) bugs.push(randomBug(bugs));
  mushroom = null; placeMushroom(); mushroomAt = 0;
  // ponytail: rocks must be distinct and off the reserved start lanes
  console.assert(
    stones.length === STONE_COUNT &&
    !stones.some((s, i) => stones.some((t, j) => i !== j && t.x===s.x && t.y===s.y)) &&
    !stones.some(s => reservedCells().some(c => c.x===s.x && c.y===s.y)),
    'rock placement invalid');
}

function newMatch() {
  resetSnake(player, {x:4, y:10}, {x:1,y:0});
  resetSnake(ai, {x:15, y:10}, {x:-1,y:0});
  resetBoardItems();
  matchOver = false;
  updateScores();
  hideOverlay();
}

// --- bug / rock count sliders -----------------------------------------------
function setBugCount(n) {
  BUG_COUNT = n;
  document.getElementById('bugVal').textContent = n;
  if (!started) resetBoardItems();   // live preview on the start screen
}
function setStoneCount(n) {
  STONE_COUNT = n;
  document.getElementById('rockVal').textContent = n;
  if (!started) resetBoardItems();
}
document.getElementById('bugSlider').addEventListener('input', e => setBugCount(+e.target.value));
document.getElementById('rockSlider').addEventListener('input', e => setStoneCount(+e.target.value));

// --- movement & collisions --------------------------------------------------
function curSpeed(s) {
  const base = s === ai ? AI_SPEED : PLAYER_SPEED;
  return invincible(s) ? base * BOOST_MULT : base;
}

function moveSnake(s, now) {
  if (s === ai) {
    s.moves++;
    ai.dir = (ai.moves % ai.randomPeriod === 0) ? aiRandomDir() : aiGreedyDir();
  }
  const head = wrap({x: s.body[0].x + s.dir.x, y: s.body[0].y + s.dir.y});
  s.body.unshift(head);

  const bi = bugs.findIndex(b => b.x === head.x && b.y === head.y);
  if (bi >= 0) {                                   // ate a bug -> grow + score
    s.score++; updateScores();
    bugs[bi] = randomBug(bugs.filter((_, j) => j !== bi));
    if (s.score >= WIN_SCORE) endMatch(s);
    return;
  }
  if (onMushroom(head)) {                          // ate the mushroom -> boost, no growth
    s.boostUntil = now + BOOST_MS;
    mushroom = null; mushroomAt = now + MUSHROOM_RESPAWN_MS;
  }
  s.body.pop();
}

// a fatal hit costs one segment; a size-1 snake can't shrink further, so it
// dies and respawns after RESPAWN_MS instead.
function damage(s) {
  if (invincible(s)) return;
  if (s.body.length > 1) s.body.pop();
  else { s.alive = false; s.body = []; s.respawnAt = Date.now() + RESPAWN_MS; }
}

function resolveCollisions() {
  const hurt = new Set();
  for (const s of [player, ai]) {
    if (!s.alive || invincible(s)) continue;
    const h = s.body[0];
    if (onStone(h)) hurt.add(s);
    else if (s.body.slice(1).some(c => c.x === h.x && c.y === h.y)) hurt.add(s);
  }
  // snake vs snake: both take a hit (unless one is phasing through on a mushroom)
  if (player.alive && ai.alive && !invincible(player) && !invincible(ai)) {
    if (onSnake(ai, player.body[0]) || onSnake(player, ai.body[0])) {
      hurt.add(player); hurt.add(ai);
    }
  }
  hurt.forEach(damage);
}

function respawn(s) {
  const o = other(s);
  const tooCloseToRival = p => o.body.length && manhattan(p, o.body[0]) < 3;
  let pos;
  do { pos = {x: rand(gw), y: rand(gh)}; }
  while (tooCloseToRival(pos) || onStone(pos) || onBug(pos) || onMushroom(pos));
  // ponytail: invariant — respawn >=3 squares from a live rival
  console.assert(!o.body.length || manhattan(pos, o.body[0]) >= 3, 'respawn too close');
  s.body = [pos];
  s.dir = {x: pos.x < gw/2 ? 1 : -1, y: 0};
  s.alive = true; s.respawnAt = 0; s.acc = 0; s.boostUntil = 0;
  if (s === player) hideOverlay();
}

// --- render -----------------------------------------------------------------
function drawSnake(s) {
  if (!s.alive) return;
  const glow = invincible(s);
  if (glow) { ctx.save(); ctx.shadowColor = '#fde047'; ctx.shadowBlur = 12; }
  s.body.forEach((c, i) => {
    ctx.fillStyle = i === 0 ? s.head : s.body_;
    ctx.beginPath();
    ctx.roundRect(c.x*grid, c.y*grid, grid-2, grid-2, 5);
    ctx.fill();
  });
  if (glow) ctx.restore();
  const h = s.body[0];
  ctx.fillStyle = s.eye;
  const ex = s.dir.x !== 0 ? (s.dir.x > 0 ? grid-7 : 2) : grid/2-2;
  const ey = s.dir.y !== 0 ? (s.dir.y > 0 ? grid-7 : 2) : grid/2-2;
  ctx.fillRect(h.x*grid + ex, h.y*grid + ey, 3, 3);
}

// little red beetle: 6 legs, 2 antennae, oval shell with a wing split
function drawBug(b) {
  const cx = b.x*grid + grid/2, cy = b.y*grid + grid/2;
  ctx.strokeStyle = '#1f2937'; ctx.lineWidth = 1;
  for (const s of [-1, 1]) {
    for (const ly of [-3, 0, 3]) {
      ctx.beginPath();
      ctx.moveTo(cx + s*3, cy + ly);
      ctx.lineTo(cx + s*7, cy + ly + (ly < 0 ? -2 : ly > 0 ? 2 : 0));
      ctx.stroke();
    }
  }
  ctx.beginPath(); ctx.moveTo(cx-1, cy-6); ctx.lineTo(cx-4, cy-9); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(cx+1, cy-6); ctx.lineTo(cx+4, cy-9); ctx.stroke();
  ctx.fillStyle = '#dc2626';                        // red shell
  ctx.beginPath(); ctx.ellipse(cx, cy, 4.5, 6.5, 0, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle = '#1f2937';
  ctx.beginPath(); ctx.arc(cx, cy - 6, 2.2, 0, Math.PI*2); ctx.fill();
  ctx.strokeStyle = '#7f1d1d';
  ctx.beginPath(); ctx.moveTo(cx, cy - 3); ctx.lineTo(cx, cy + 5); ctx.stroke();
}

function drawStone(st) {
  const x = st.x*grid, y = st.y*grid;
  ctx.fillStyle = '#6b7280';
  ctx.beginPath(); ctx.roundRect(x+2, y+3, grid-4, grid-5, 4); ctx.fill();
  ctx.fillStyle = '#9ca3af';
  ctx.beginPath(); ctx.arc(x + grid/2 - 2, y + grid/2 - 1, 2.5, 0, Math.PI*2); ctx.fill();
}

function drawMushroom(m) {
  const x = m.x*grid, y = m.y*grid, cx = x + grid/2;
  ctx.fillStyle = '#f5f5dc';                        // stem
  ctx.fillRect(cx - 2, y + grid/2, 4, grid/2 - 3);
  ctx.fillStyle = '#dc2626';                        // cap
  ctx.beginPath(); ctx.arc(cx, y + grid/2, grid/2 - 2, Math.PI, 0); ctx.fill();
  ctx.fillStyle = '#fff';                           // spots
  ctx.beginPath(); ctx.arc(cx - 3, y + grid/2 - 2, 1.3, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(cx + 3, y + grid/2 - 1, 1.1, 0, Math.PI*2); ctx.fill();
}

function draw() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  stones.forEach(drawStone);
  if (mushroom) drawMushroom(mushroom);
  bugs.forEach(drawBug);
  drawSnake(player);
  drawSnake(ai);
}

function tick() {
  frame++;
  const now = Date.now();
  if (started && !matchOver) {
    for (const s of [player, ai]) if (!s.alive && now >= s.respawnAt) respawn(s);
    if (!player.alive) {
      const secs = Math.max(0, Math.ceil((player.respawnAt - now) / 1000));
      showOverlay('💀 You died', 'Respawning in ' + secs + '…', false);
    }
    if (!mushroom && now >= mushroomAt) placeMushroom();

    for (const s of [player, ai]) {
      if (!s.alive) continue;
      s.acc += curSpeed(s);
      if (s.acc >= 1) { s.acc -= 1; moveSnake(s, now); }
    }
    bugAcc += BUG_SPEED;
    if (bugAcc >= 1) { bugAcc -= 1; roamBugs(); }

    resolveCollisions();
  }
  draw();
  setTimeout(tick, BASE_MS);
}

setDifficulty('normal');
newMatch();          // place a board to preview behind the start screen
showStartScreen();
tick();
</script>
</body>
</html>
