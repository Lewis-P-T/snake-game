<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Snake</title>
<style>
  body { background:#111; color:#eee; font-family:sans-serif; display:flex; flex-direction:column; align-items:center; }
  canvas { background:#1a1a2e; border:1px solid #555; margin-top:20px; touch-action:none; }
  button { font-size:1.2em; padding:10px 16px; margin:2px; }
  #pad { display:grid; grid-template-columns:repeat(3, 1fr); gap:4px; margin-top:10px; }
  #pad button:nth-child(1) { grid-column:2; }
  #pad button:nth-child(2) { grid-column:1; }
  #pad button:nth-child(3) { grid-column:2; }
  #pad button:nth-child(4) { grid-column:3; }
</style>
</head>
<body>
<h1>Snake</h1>
<p id="score">Score: 0</p>
<canvas id="game" width="400" height="400"></canvas>
<p id="status"></p>
<button id="restart">Restart</button>
<div id="pad">
  <button data-dir="up">↑</button>
  <button data-dir="left">←</button>
  <button data-dir="down">↓</button>
  <button data-dir="right">→</button>
</div>
<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const grid = 20;
let snake, dir, food, gameOver, score;

function reset() {
  snake = [{x:8,y:8}];
  dir = {x:1,y:0};
  food = randomFood();
  gameOver = false;
  score = 0;
  document.getElementById('status').textContent = '';
  document.getElementById('score').textContent = 'Score: 0';
}

function randomFood() {
  return {
    x: Math.floor(Math.random() * canvas.width / grid),
    y: Math.floor(Math.random() * canvas.height / grid)
  };
}

function setDir(d) {
  if (gameOver) { reset(); return; }
  if (d === 'up' && dir.y === 0) dir = {x:0,y:-1};
  else if (d === 'down' && dir.y === 0) dir = {x:0,y:1};
  else if (d === 'left' && dir.x === 0) dir = {x:-1,y:0};
  else if (d === 'right' && dir.x === 0) dir = {x:1,y:0};
}

document.addEventListener('keydown', e => {
  const map = {ArrowUp:'up', ArrowDown:'down', ArrowLeft:'left', ArrowRight:'right'};
  if (map[e.key]) setDir(map[e.key]);
  else if (gameOver) reset();
});

document.getElementById('restart').addEventListener('click', reset);
document.getElementById('pad').addEventListener('click', e => {
  const d = e.target.dataset.dir;
  if (d) setDir(d);
});

function tick() {
  if (!gameOver) {
    const head = {x: snake[0].x + dir.x, y: snake[0].y + dir.y};
    const hitWall = head.x < 0 || head.y < 0 || head.x >= canvas.width/grid || head.y >= canvas.height/grid;
    const hitSelf = snake.some(s => s.x === head.x && s.y === head.y);
    if (hitWall || hitSelf) {
      gameOver = true;
      document.getElementById('status').textContent = 'Game Over — press any key to restart';
    } else {
      snake.unshift(head);
      if (head.x === food.x && head.y === food.y) {
        food = randomFood();
        score++;
        document.getElementById('score').textContent = 'Score: ' + score;
      } else {
        snake.pop();
      }
    }
  }

  ctx.clearRect(0, 0, canvas.width, canvas.height);
  ctx.fillStyle = 'lime';
  snake.forEach(s => ctx.fillRect(s.x*grid, s.y*grid, grid-1, grid-1));
  ctx.fillStyle = 'red';
  ctx.fillRect(food.x*grid, food.y*grid, grid-1, grid-1);

  setTimeout(tick, 120);
}

reset();
tick();
</script>
</body>
</html>
