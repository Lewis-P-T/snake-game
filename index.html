<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Snake</title>
<style>
  body { background:#111; color:#eee; font-family:sans-serif; display:flex; flex-direction:column; align-items:center; }
  canvas { background:#222; border:1px solid #555; margin-top:20px; }
</style>
</head>
<body>
<h1>Snake</h1>
<canvas id="game" width="400" height="400"></canvas>
<p id="status"></p>
<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const grid = 20;
let snake, dir, food, gameOver;

function reset() {
  snake = [{x:8,y:8}];
  dir = {x:1,y:0};
  food = randomFood();
  gameOver = false;
  document.getElementById('status').textContent = '';
}

function randomFood() {
  return {
    x: Math.floor(Math.random() * canvas.width / grid),
    y: Math.floor(Math.random() * canvas.height / grid)
  };
}

document.addEventListener('keydown', e => {
  if (gameOver) { reset(); return; }
  if (e.key === 'ArrowUp' && dir.y === 0) dir = {x:0,y:-1};
  else if (e.key === 'ArrowDown' && dir.y === 0) dir = {x:0,y:1};
  else if (e.key === 'ArrowLeft' && dir.x === 0) dir = {x:-1,y:0};
  else if (e.key === 'ArrowRight' && dir.x === 0) dir = {x:1,y:0};
});

function tick() {
  if (!gameOver) {
    const head = {x: snake[0].x + dir.x, y: snake[0].y + dir.y};
    const hitWall = head.x < 0 || head.y < 0 || head.x >= canvas.width/grid || head.y >= canvas.height/grid;
    const hitSelf = snake.some(s => s.x === head.x && s.y === head.y);
    if (hitWall || hitSelf) {
      gameOver = true;
      document.getElementById('status').textContent = 'Game Over — press any key to restart';
    } else {
      snake.unshift(head);
      if (head.x === food.x && head.y === food.y) {
        food = randomFood();
      } else {
        snake.pop();
      }
    }
  }

  ctx.clearRect(0, 0, canvas.width, canvas.height);
  ctx.fillStyle = 'lime';
  snake.forEach(s => ctx.fillRect(s.x*grid, s.y*grid, grid-1, grid-1));
  ctx.fillStyle = 'red';
  ctx.fillRect(food.x*grid, food.y*grid, grid-1, grid-1);

  setTimeout(tick, 120);
}

reset();
tick();
</script>
</body>
</html>
