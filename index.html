<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Snake</title>
<style>
  body { background:#0b2e13; color:#d7ffd9; font-family:'Trebuchet MS',sans-serif; display:flex; flex-direction:column; align-items:center; }
  h1 { color:#4ade80; text-shadow:2px 2px #052e0d; letter-spacing:2px; }
  #score { font-size:1.2em; }
  #score .you { color:#4ade80; }
  #score .ai { color:#c084fc; }
  #wrap { position:relative; margin-top:20px; }
  canvas { background:#123d1a; border:4px solid #2f6b3a; border-radius:8px; touch-action:none; display:block; }
  #overlay {
    position:absolute; inset:0; display:none; flex-direction:column;
    align-items:center; justify-content:center; gap:10px;
    background:rgba(5,20,8,0.85); border-radius:8px; text-align:center;
  }
  #overlay.show { display:flex; }
  #overlay h2 { color:#f87171; margin:0; font-size:2em; }
  button { font-size:1.2em; padding:10px 16px; margin:2px; background:#2f6b3a; color:#d7ffd9; border:none; border-radius:6px; cursor:pointer; }
  button:hover { background:#3f8a4c; }
  #pad { display:grid; grid-template-columns:repeat(3, 1fr); gap:4px; margin-top:10px; }
  #pad button:nth-child(1) { grid-column:2; }
  #pad button:nth-child(2) { grid-column:1; }
  #pad button:nth-child(3) { grid-column:2; }
  #pad button:nth-child(4) { grid-column:3; }
</style>
</head>
<body>
<h1>🐍 Snake</h1>
<p id="score"><span class="you">You: 0</span> &nbsp;·&nbsp; <span class="ai">AI: 0</span></p>
<div id="wrap">
  <canvas id="game" width="400" height="400"></canvas>
  <div id="overlay">
    <h2>💀 You died</h2>
    <p id="respawnMsg"></p>
  </div>
</div>
<div id="pad">
  <button data-dir="up">↑</button>
  <button data-dir="left">←</button>
  <button data-dir="down">↓</button>
  <button data-dir="right">→</button>
</div>
<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const grid = 20;
const gw = canvas.width / grid, gh = canvas.height / grid;
const RESPAWN_MS = 5000;

const rand = n => Math.floor(Math.random() * n);
const manhattan = (a, b) => Math.abs(a.x - b.x) + Math.abs(a.y - b.y);
const onSnake = (s, p) => s.body.some(c => c.x === p.x && c.y === p.y);

function makeSnake(pos, dir, colors) {
  return { body: [pos], dir, ...colors, score: 0, alive: true, respawnAt: 0 };
}

const player = makeSnake({x:4, y:10}, {x:1,y:0},
  { body_: '#22c55e', head: '#4ade80', eye: '#052e0d' });
const ai = makeSnake({x:15, y:10}, {x:-1,y:0},
  { body_: '#9333ea', head: '#c084fc', eye: '#2e0552' });
let food = randomFood();

function randomFood() {
  let p;
  do { p = {x: rand(gw), y: rand(gh)}; }
  while (onSnake(player, p) || onSnake(ai, p));
  return p;
}

function other(s) { return s === player ? ai : player; }

// --- player input -----------------------------------------------------------
function setDir(d) {
  if (!player.alive) return;
  const c = player.dir;
  if (d === 'up' && c.y === 0) player.dir = {x:0,y:-1};
  else if (d === 'down' && c.y === 0) player.dir = {x:0,y:1};
  else if (d === 'left' && c.x === 0) player.dir = {x:-1,y:0};
  else if (d === 'right' && c.x === 0) player.dir = {x:1,y:0};
}
document.addEventListener('keydown', e => {
  const map = {ArrowUp:'up', ArrowDown:'down', ArrowLeft:'left', ArrowRight:'right'};
  if (map[e.key]) { e.preventDefault(); setDir(map[e.key]); }
});
document.getElementById('pad').addEventListener('click', e => {
  if (e.target.dataset.dir) setDir(e.target.dataset.dir);
});

// --- AI: greedy step toward the apple, avoiding walls and both snakes --------
// ponytail: naive one-step greedy heuristic. Good enough for an opponent; it
// can trap itself, which just costs it a death + respawn. Upgrade to BFS if it
// needs to play smarter.
function aiChooseDir() {
  const head = ai.body[0];
  const dirs = [{x:1,y:0},{x:-1,y:0},{x:0,y:1},{x:0,y:-1}];
  let best = ai.dir, bestScore = -Infinity;
  for (const d of dirs) {
    if (d.x === -ai.dir.x && d.y === -ai.dir.y) continue; // no 180°
    const nx = head.x + d.x, ny = head.y + d.y;
    if (nx < 0 || ny < 0 || nx >= gw || ny >= gh) continue;
    const cell = {x:nx, y:ny};
    if (onSnake(ai, cell) || (player.alive && onSnake(player, cell))) continue;
    const score = -manhattan(cell, food) + Math.random() * 0.5;
    if (score > bestScore) { bestScore = score; best = d; }
  }
  return best;
}

// --- death & respawn --------------------------------------------------------
function kill(s) {
  s.alive = false;
  s.body = [];
  s.respawnAt = Date.now() + RESPAWN_MS;
  if (s === player) document.getElementById('overlay').classList.add('show');
}

function tooClose(p, o) {
  if (!o.body.length) return false;               // opponent dead -> anywhere ok
  return manhattan(p, o.body[0]) < 3 || onSnake(o, p);
}

function respawn(s) {
  const o = other(s);
  let pos;
  do { pos = {x: rand(gw), y: rand(gh)}; } while (tooClose(pos, o));
  // ponytail: invariant the spec demands — land >=3 squares from a live rival
  console.assert(!o.body.length || manhattan(pos, o.body[0]) >= 3, 'respawn too close');
  s.body = [pos];
  s.dir = {x: pos.x < gw/2 ? 1 : -1, y: 0};        // aim inward so we don't wall out
  s.alive = true;
  s.respawnAt = 0;
  if (s === player) document.getElementById('overlay').classList.remove('show');
}

// --- main loop --------------------------------------------------------------
function updateScores() {
  document.querySelector('#score .you').textContent = 'You: ' + player.score;
  document.querySelector('#score .ai').textContent  = 'AI: '  + ai.score;
}

function step() {
  if (ai.alive) ai.dir = aiChooseDir();

  const movers = [player, ai].filter(s => s.alive);

  // advance every live snake, handling food
  for (const s of movers) {
    const head = {x: s.body[0].x + s.dir.x, y: s.body[0].y + s.dir.y};
    s.body.unshift(head);
    if (head.x === food.x && head.y === food.y) { s.score++; updateScores(); food = randomFood(); }
    else s.body.pop();
  }

  // resolve deaths against the freshly-moved bodies (covers head-to-head)
  const dead = [];
  for (const s of movers) {
    const head = s.body[0], o = other(s);
    const hitWall = head.x < 0 || head.y < 0 || head.x >= gw || head.y >= gh;
    const hitSelf = s.body.slice(1).some(c => c.x === head.x && c.y === head.y);
    const hitOther = o.alive && onSnake(o, head);
    if (hitWall || hitSelf || hitOther) dead.push(s);
  }
  dead.forEach(kill);
}

function drawSnake(s) {
  if (!s.alive) return;
  s.body.forEach((c, i) => {
    ctx.fillStyle = i === 0 ? s.head : s.body_;
    ctx.beginPath();
    ctx.roundRect(c.x*grid, c.y*grid, grid-2, grid-2, 5);
    ctx.fill();
  });
  const h = s.body[0];
  ctx.fillStyle = s.eye;
  const ex = s.dir.x !== 0 ? (s.dir.x > 0 ? grid-7 : 2) : grid/2-2;
  const ey = s.dir.y !== 0 ? (s.dir.y > 0 ? grid-7 : 2) : grid/2-2;
  ctx.fillRect(h.x*grid + ex, h.y*grid + ey, 3, 3);
}

function draw() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  drawSnake(player);
  drawSnake(ai);
  ctx.fillStyle = '#e11d48';
  ctx.beginPath();
  ctx.arc(food.x*grid + grid/2, food.y*grid + grid/2, grid/2-2, 0, Math.PI*2);
  ctx.fill();
  ctx.fillStyle = '#166534';
  ctx.fillRect(food.x*grid + grid/2 - 1, food.y*grid + 1, 2, 4);
}

function tick() {
  const now = Date.now();
  for (const s of [player, ai]) if (!s.alive && now >= s.respawnAt) respawn(s);
  if (!player.alive) {
    const secs = Math.ceil((player.respawnAt - now) / 1000);
    document.getElementById('respawnMsg').textContent = 'Respawning in ' + secs + '…';
  }
  step();
  draw();
  setTimeout(tick, 120);
}

updateScores();
tick();
</script>
</body>
</html>
