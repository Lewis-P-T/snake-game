<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Snake</title>
<style>
  body { background:#0b2e13; color:#d7ffd9; font-family:'Trebuchet MS',sans-serif; display:flex; flex-direction:column; align-items:center; }
  h1 { color:#4ade80; text-shadow:2px 2px #052e0d; letter-spacing:2px; margin-bottom:4px; }
  #score { font-size:1.2em; margin:4px; }
  #score .you { color:#4ade80; }
  #score .ai { color:#c084fc; }
  #goal { margin:0; font-size:0.85em; opacity:0.7; }
  #wrap { position:relative; margin-top:16px; }
  canvas { background:#123d1a; border:4px solid #2f6b3a; border-radius:8px; touch-action:none; display:block; }
  #overlay {
    position:absolute; inset:0; display:none; flex-direction:column;
    align-items:center; justify-content:center; gap:10px;
    background:rgba(5,20,8,0.85); border-radius:8px; text-align:center;
  }
  #overlay.show { display:flex; }
  #overlay h2 { color:#f87171; margin:0; font-size:2em; }
  button { font-size:1.2em; padding:10px 16px; margin:2px; background:#2f6b3a; color:#d7ffd9; border:none; border-radius:6px; cursor:pointer; }
  button:hover { background:#3f8a4c; }
  #difficulty { margin-top:14px; display:flex; align-items:center; gap:6px; }
  #difficulty span { opacity:0.8; font-size:0.9em; }
  #difficulty button { font-size:1em; padding:6px 12px; }
  #difficulty button.active { background:#4ade80; color:#052e0d; font-weight:bold; }
</style>
</head>
<body>
<h1>🐍 Snake</h1>
<p id="score"><span class="you">You: 0</span> &nbsp;·&nbsp; <span class="ai">AI: 0</span></p>
<p id="goal">First to 10 ladybugs wins — use the arrow keys</p>
<div id="wrap">
  <canvas id="game" width="400" height="400"></canvas>
  <div id="overlay">
    <h2 id="overlayTitle"></h2>
    <p id="overlayMsg"></p>
    <button id="restartBtn">Play again</button>
  </div>
</div>
<div id="difficulty">
  <span>AI speed:</span>
  <button data-diff="easy">Easy</button>
  <button data-diff="normal">Normal</button>
  <button data-diff="hard">Hard</button>
</div>
<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const grid = 20;
const gw = canvas.width / grid, gh = canvas.height / grid;
const RESPAWN_MS = 5000;
const WIN_SCORE = 10;
const BUG_COUNT = 2;
const STONE_COUNT = 6;
const BASE_MS = 60;                          // loop granularity; things move every N of these
const PLAYER_INTERVAL = 2;                    // -> 120ms per player move
const AI_INTERVAL = { easy: 3, normal: 2, hard: 1 };  // slower / same / faster than player
const BUG_INTERVAL = 10;                      // ladybugs roam once every ~600ms (slow)

const rand = n => Math.floor(Math.random() * n);
const manhattan = (a, b) => Math.abs(a.x - b.x) + Math.abs(a.y - b.y);
const onSnake = (s, p) => s.body.some(c => c.x === p.x && c.y === p.y);
const shuffled = arr => arr.map(v => [Math.random(), v]).sort((a, b) => a[0] - b[0]).map(x => x[1]);

function makeSnake(pos, dir, colors, interval) {
  return { body: [pos], dir, ...colors, score: 0, alive: true, respawnAt: 0, interval };
}

const player = makeSnake({x:4, y:10}, {x:1,y:0},
  { body_: '#22c55e', head: '#4ade80', eye: '#052e0d' }, PLAYER_INTERVAL);
const ai = makeSnake({x:15, y:10}, {x:-1,y:0},
  { body_: '#9333ea', head: '#c084fc', eye: '#2e0552' }, AI_INTERVAL.normal);
let bugs = [];
let stones = [];
let matchOver = false;
let frame = 0;

function other(s) { return s === player ? ai : player; }
const onStone = p => stones.some(s => s.x === p.x && s.y === p.y);

// snake start cells + the lane just ahead of each — kept clear so stones never
// force an instant death at the start of a match.
function reservedCells() {
  return [
    {x:4,y:10},{x:5,y:10},{x:6,y:10},{x:7,y:10},
    {x:15,y:10},{x:14,y:10},{x:13,y:10},{x:12,y:10},
  ];
}

function randomStone(placed) {
  const reserved = reservedCells();
  let p;
  do { p = {x: rand(gw), y: rand(gh)}; }
  while (reserved.some(c => c.x===p.x && c.y===p.y) || placed.some(c => c.x===p.x && c.y===p.y));
  return p;
}

function randomBug(existing) {
  let p;
  do { p = {x: rand(gw), y: rand(gh)}; }
  while (onSnake(player, p) || onSnake(ai, p) || onStone(p) || existing.some(b => b.x===p.x && b.y===p.y));
  return p;
}

// ladybugs wander one square at a time, avoiding walls, stones, snakes and each other
function roamBugs() {
  for (let i = 0; i < bugs.length; i++) {
    for (const d of shuffled([{x:1,y:0},{x:-1,y:0},{x:0,y:1},{x:0,y:-1}])) {
      const p = {x: bugs[i].x + d.x, y: bugs[i].y + d.y};
      if (p.x < 0 || p.y < 0 || p.x >= gw || p.y >= gh) continue;
      if (onStone(p) || onSnake(player, p) || onSnake(ai, p)) continue;
      if (bugs.some((b, j) => j !== i && b.x===p.x && b.y===p.y)) continue;
      bugs[i] = p;
      break;
    }
  }
}

// --- overlay ----------------------------------------------------------------
const overlay = document.getElementById('overlay');
function showOverlay(title, msg, showBtn) {
  document.getElementById('overlayTitle').textContent = title;
  document.getElementById('overlayMsg').textContent = msg;
  document.getElementById('restartBtn').style.display = showBtn ? '' : 'none';
  overlay.classList.add('show');
}
function hideOverlay() { overlay.classList.remove('show'); }

// --- player input (keyboard only) -------------------------------------------
function setDir(d) {
  if (!player.alive || matchOver) return;
  const c = player.dir;
  if (d === 'up' && c.y === 0) player.dir = {x:0,y:-1};
  else if (d === 'down' && c.y === 0) player.dir = {x:0,y:1};
  else if (d === 'left' && c.x === 0) player.dir = {x:-1,y:0};
  else if (d === 'right' && c.x === 0) player.dir = {x:1,y:0};
}
document.addEventListener('keydown', e => {
  const map = {ArrowUp:'up', ArrowDown:'down', ArrowLeft:'left', ArrowRight:'right'};
  if (map[e.key]) { e.preventDefault(); setDir(map[e.key]); }
});
document.getElementById('restartBtn').addEventListener('click', newMatch);

// --- difficulty = AI move speed ---------------------------------------------
function setDifficulty(d) {
  ai.interval = AI_INTERVAL[d];
  document.querySelectorAll('#difficulty button').forEach(b =>
    b.classList.toggle('active', b.dataset.diff === d));
}
document.getElementById('difficulty').addEventListener('click', e => {
  if (e.target.dataset.diff) setDifficulty(e.target.dataset.diff);
});

// --- AI: greedy step toward the nearest bug, avoiding walls, stones, snakes --
// ponytail: naive one-step greedy heuristic. Good enough for an opponent; it
// can trap itself, which just costs it a death + respawn. Upgrade to BFS if it
// needs to play smarter.
function aiChooseDir() {
  const head = ai.body[0];
  const dirs = [{x:1,y:0},{x:-1,y:0},{x:0,y:1},{x:0,y:-1}];
  let best = ai.dir, bestScore = -Infinity;
  for (const d of dirs) {
    if (d.x === -ai.dir.x && d.y === -ai.dir.y) continue; // no 180°
    const nx = head.x + d.x, ny = head.y + d.y;
    if (nx < 0 || ny < 0 || nx >= gw || ny >= gh) continue;
    const cell = {x:nx, y:ny};
    if (onStone(cell) || onSnake(ai, cell) || (player.alive && onSnake(player, cell))) continue;
    const near = Math.min(...bugs.map(b => manhattan(cell, b)));
    const score = -near + Math.random() * 0.5;
    if (score > bestScore) { bestScore = score; best = d; }
  }
  return best;
}

// --- death & respawn --------------------------------------------------------
function kill(s) {
  s.alive = false;
  s.body = [];
  s.respawnAt = Date.now() + RESPAWN_MS;
}

function tooClose(p, o) {
  if (!o.body.length) return false;               // opponent dead -> anywhere ok
  return manhattan(p, o.body[0]) < 3 || onSnake(o, p);
}

function respawn(s) {
  const o = other(s);
  let pos;
  do { pos = {x: rand(gw), y: rand(gh)}; } while (tooClose(pos, o) || onStone(pos));
  // ponytail: invariant the spec demands — land >=3 squares from a live rival
  console.assert(!o.body.length || manhattan(pos, o.body[0]) >= 3, 'respawn too close');
  s.body = [pos];
  s.dir = {x: pos.x < gw/2 ? 1 : -1, y: 0};        // aim inward so we don't wall out
  s.alive = true;
  s.respawnAt = 0;
  if (s === player) hideOverlay();
}

// --- match flow -------------------------------------------------------------
function updateScores() {
  document.querySelector('#score .you').textContent = 'You: ' + player.score;
  document.querySelector('#score .ai').textContent  = 'AI: '  + ai.score;
}

function endMatch(winner) {
  if (matchOver) return;
  matchOver = true;
  const won = winner === player;
  showOverlay(won ? '🏆 You win!' : '💀 AI wins!',
              'You ' + player.score + '  ·  AI ' + ai.score, true);
}

function resetSnake(s, pos, dir) {
  s.body = [pos]; s.dir = {...dir}; s.alive = true; s.respawnAt = 0; s.score = 0;
}

function newMatch() {
  resetSnake(player, {x:4, y:10}, {x:1,y:0});
  resetSnake(ai, {x:15, y:10}, {x:-1,y:0});
  stones = [];
  while (stones.length < STONE_COUNT) stones.push(randomStone(stones));
  bugs = [];
  while (bugs.length < BUG_COUNT) bugs.push(randomBug(bugs));
  // ponytail: stones must be distinct and off the reserved start lanes
  console.assert(
    stones.length === STONE_COUNT &&
    !stones.some((s, i) => stones.some((t, j) => i !== j && t.x===s.x && t.y===s.y)) &&
    !stones.some(s => reservedCells().some(c => c.x===s.x && c.y===s.y)),
    'stone placement invalid');
  matchOver = false;
  updateScores();
  hideOverlay();
}

// --- main loop --------------------------------------------------------------
function step(movers) {
  if (movers.includes(ai)) ai.dir = aiChooseDir();

  // advance every moving snake, handling bugs
  for (const s of movers) {
    const head = {x: s.body[0].x + s.dir.x, y: s.body[0].y + s.dir.y};
    s.body.unshift(head);
    const i = bugs.findIndex(b => b.x === head.x && b.y === head.y);
    if (i >= 0) {
      s.score++; updateScores();
      bugs[i] = randomBug(bugs.filter((_, j) => j !== i));
      if (s.score >= WIN_SCORE) endMatch(s);
    } else {
      s.body.pop();
    }
  }

  // resolve deaths against the freshly-moved bodies (covers head-to-head)
  const dead = [];
  for (const s of movers) {
    const head = s.body[0], o = other(s);
    const hitWall = head.x < 0 || head.y < 0 || head.x >= gw || head.y >= gh;
    const hitSelf = s.body.slice(1).some(c => c.x === head.x && c.y === head.y);
    const hitOther = o.alive && onSnake(o, head);
    const hitStone = onStone(head);
    if (hitWall || hitSelf || hitOther || hitStone) dead.push(s);
  }
  dead.forEach(kill);
}

function drawSnake(s) {
  if (!s.alive) return;
  s.body.forEach((c, i) => {
    ctx.fillStyle = i === 0 ? s.head : s.body_;
    ctx.beginPath();
    ctx.roundRect(c.x*grid, c.y*grid, grid-2, grid-2, 5);
    ctx.fill();
  });
  const h = s.body[0];
  ctx.fillStyle = s.eye;
  const ex = s.dir.x !== 0 ? (s.dir.x > 0 ? grid-7 : 2) : grid/2-2;
  const ey = s.dir.y !== 0 ? (s.dir.y > 0 ? grid-7 : 2) : grid/2-2;
  ctx.fillRect(h.x*grid + ex, h.y*grid + ey, 3, 3);
}

function drawLadybug(b) {
  const cx = b.x*grid + grid/2, cy = b.y*grid + grid/2, r = grid/2 - 2;
  ctx.fillStyle = '#dc2626';                       // red shell
  ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI*2); ctx.fill();
  ctx.strokeStyle = '#1f2937'; ctx.lineWidth = 1;  // wing split
  ctx.beginPath(); ctx.moveTo(cx, cy - r); ctx.lineTo(cx, cy + r); ctx.stroke();
  ctx.fillStyle = '#1f2937';
  ctx.beginPath(); ctx.arc(cx, cy - r + 1, 2.4, 0, Math.PI*2); ctx.fill();  // head
  [[-3,-1],[3,-1],[-3,3],[3,3]].forEach(([dx,dy]) => {                      // spots
    ctx.beginPath(); ctx.arc(cx+dx, cy+dy, 1.3, 0, Math.PI*2); ctx.fill();
  });
}

function drawStone(st) {
  const x = st.x*grid, y = st.y*grid;
  ctx.fillStyle = '#6b7280';
  ctx.beginPath(); ctx.roundRect(x+2, y+3, grid-4, grid-5, 4); ctx.fill();
  ctx.fillStyle = '#9ca3af';                       // top-left highlight
  ctx.beginPath(); ctx.arc(x + grid/2 - 2, y + grid/2 - 1, 2.5, 0, Math.PI*2); ctx.fill();
}

function draw() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  stones.forEach(drawStone);
  drawSnake(player);
  drawSnake(ai);
  bugs.forEach(drawLadybug);
}

function tick() {
  frame++;
  const now = Date.now();
  if (!matchOver) {
    for (const s of [player, ai]) if (!s.alive && now >= s.respawnAt) respawn(s);
    if (!player.alive) {
      const secs = Math.max(0, Math.ceil((player.respawnAt - now) / 1000));
      showOverlay('💀 You died', 'Respawning in ' + secs + '…', false);
    }
    const movers = [player, ai].filter(s => s.alive && frame % s.interval === 0);
    if (movers.length) step(movers);
    if (frame % BUG_INTERVAL === 0) roamBugs();
  }
  draw();
  setTimeout(tick, BASE_MS);
}

setDifficulty('normal');
newMatch();
tick();
</script>
</body>
</html>
