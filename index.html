<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Snake</title>
<style>
  body { background:#0b2e13; color:#d7ffd9; font-family:'Trebuchet MS',sans-serif; display:flex; flex-direction:column; align-items:center; }
  h1 { color:#4ade80; text-shadow:2px 2px #052e0d; letter-spacing:2px; }
  #wrap { position:relative; margin-top:20px; }
  canvas { background:#123d1a; border:4px solid #2f6b3a; border-radius:8px; touch-action:none; display:block; }
  #overlay {
    position:absolute; inset:0; display:none; flex-direction:column;
    align-items:center; justify-content:center; gap:10px;
    background:rgba(5,20,8,0.85); border-radius:8px; text-align:center;
  }
  #overlay.show { display:flex; }
  #overlay h2 { color:#f87171; margin:0; font-size:2em; }
  button { font-size:1.2em; padding:10px 16px; margin:2px; background:#2f6b3a; color:#d7ffd9; border:none; border-radius:6px; cursor:pointer; }
  button:hover { background:#3f8a4c; }
  #pad { display:grid; grid-template-columns:repeat(3, 1fr); gap:4px; margin-top:10px; }
  #pad button:nth-child(1) { grid-column:2; }
  #pad button:nth-child(2) { grid-column:1; }
  #pad button:nth-child(3) { grid-column:2; }
  #pad button:nth-child(4) { grid-column:3; }
</style>
</head>
<body>
<h1>🐍 Snake</h1>
<p id="score">Score: 0</p>
<div id="wrap">
  <canvas id="game" width="400" height="400"></canvas>
  <div id="overlay">
    <h2>Game Over</h2>
    <p id="finalScore"></p>
    <button id="overlayRestart">Restart</button>
  </div>
</div>
<div id="pad">
  <button data-dir="up">↑</button>
  <button data-dir="left">←</button>
  <button data-dir="down">↓</button>
  <button data-dir="right">→</button>
</div>
<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const grid = 20;
let snake, dir, food, gameOver, score;

function reset() {
  snake = [{x:8,y:8}];
  dir = {x:1,y:0};
  food = randomFood();
  gameOver = false;
  score = 0;
  document.getElementById('overlay').classList.remove('show');
  document.getElementById('score').textContent = 'Score: 0';
}

function randomFood() {
  return {
    x: Math.floor(Math.random() * canvas.width / grid),
    y: Math.floor(Math.random() * canvas.height / grid)
  };
}

function setDir(d) {
  if (gameOver) { reset(); return; }
  if (d === 'up' && dir.y === 0) dir = {x:0,y:-1};
  else if (d === 'down' && dir.y === 0) dir = {x:0,y:1};
  else if (d === 'left' && dir.x === 0) dir = {x:-1,y:0};
  else if (d === 'right' && dir.x === 0) dir = {x:1,y:0};
}

document.addEventListener('keydown', e => {
  const map = {ArrowUp:'up', ArrowDown:'down', ArrowLeft:'left', ArrowRight:'right'};
  if (map[e.key]) setDir(map[e.key]);
  else if (gameOver) reset();
});

document.getElementById('overlayRestart').addEventListener('click', reset);
document.getElementById('pad').addEventListener('click', e => {
  const d = e.target.dataset.dir;
  if (d) setDir(d);
});

function tick() {
  if (!gameOver) {
    const head = {x: snake[0].x + dir.x, y: snake[0].y + dir.y};
    const hitWall = head.x < 0 || head.y < 0 || head.x >= canvas.width/grid || head.y >= canvas.height/grid;
    const hitSelf = snake.some(s => s.x === head.x && s.y === head.y);
    if (hitWall || hitSelf) {
      gameOver = true;
      document.getElementById('finalScore').textContent = 'Score: ' + score;
      document.getElementById('overlay').classList.add('show');
    } else {
      snake.unshift(head);
      if (head.x === food.x && head.y === food.y) {
        food = randomFood();
        score++;
        document.getElementById('score').textContent = 'Score: ' + score;
      } else {
        snake.pop();
      }
    }
  }

  ctx.clearRect(0, 0, canvas.width, canvas.height);

  snake.forEach((s, i) => {
    ctx.fillStyle = i === 0 ? '#4ade80' : '#22c55e';
    ctx.beginPath();
    ctx.roundRect(s.x*grid, s.y*grid, grid-2, grid-2, 5);
    ctx.fill();
  });
  const head = snake[0];
  ctx.fillStyle = '#052e0d';
  const eyeOffX = dir.x !== 0 ? (dir.x > 0 ? grid-7 : 2) : grid/2-2;
  const eyeOffY = dir.y !== 0 ? (dir.y > 0 ? grid-7 : 2) : grid/2-2;
  ctx.fillRect(head.x*grid + eyeOffX, head.y*grid + eyeOffY, 3, 3);

  ctx.fillStyle = '#e11d48';
  ctx.beginPath();
  ctx.arc(food.x*grid + grid/2, food.y*grid + grid/2, grid/2-2, 0, Math.PI*2);
  ctx.fill();
  ctx.fillStyle = '#166534';
  ctx.fillRect(food.x*grid + grid/2 - 1, food.y*grid + 1, 2, 4);

  setTimeout(tick, 120);
}

reset();
tick();
</script>
</body>
</html>
